<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Настройки — Мой каталог</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      max-width: 420px;
      color: #1a1a1a;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 16px;
    }
    label {
      display: block;
      margin-bottom: 14px;
      font-size: 13px;
      color: #4a4a48;
    }
    input {
      width: 100%;
      padding: 7px 9px;
      margin-top: 4px;
      font-size: 13px;
      border: 1px solid #d9d9d5;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      color: #2563eb;
      font-size: 13px;
      min-height: 16px;
    }
    p {
      font-size: 12px;
      color: #767672;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Настройки каталога</h2>
  <p>
    Адрес — там, где крутится сайт (<code>apps/web</code>). Для локальной
    разработки: <code>http://localhost:3000</code>. Ключ — значение
    <code>EXTENSION_API_KEY</code> из <code>apps/web/.env</code>.
  </p>
  <label>
    Адрес сайта каталога
    <input id="apiUrl" placeholder="http://localhost:3000" />
  </label>
  <label>
    API-ключ
    <input id="apiKey" placeholder="EXTENSION_API_KEY" />
  </label>
  <button id="save">Сохранить</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
